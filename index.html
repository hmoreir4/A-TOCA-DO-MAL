<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Toca do Mal</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #080b08;
      color: #c5c5ad;
      font-family: Georgia, serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    main {
      padding: 30px 20px;
    }

    h1 {
      color: #89965a;
      font-size: clamp(42px, 9vw, 88px);
      letter-spacing: 5px;
      margin-bottom: 15px;
    }

    p {
      color: #a2a18e;
      line-height: 1.8;
    }

    .aviso {
      margin-top: 35px;
      font-size: 12px;
      letter-spacing: 3px;
      color: #667348;
    }
  </style>
</head>

<body>
  <main>
    <h1>A TOCA DO MAL</h1>

    <p>
      A floresta está esperando.<br>
      Você tem certeza de que quer entrar?
    </p>

    <div class="aviso">
      O BOSQUE NÃO ESQUECE
    </div>
  </main>
</body>
</html>
